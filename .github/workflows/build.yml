name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure Git Safe Directory & Identity
      run: |
        git config --global --add safe.directory '*'
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget curl unzip libltdl-dev libffi-dev libssl-dev \
          build-essential zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo6 cmake libstdc++6 openjdk-17-jdk ant autoconf libtool pkg-config patch

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --user "Cython<3.0.0"
        pip install --user buildozer

    - name: Setup Android Command-line Tools & Licenses
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
        mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
        ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
        rm /tmp/cmdline-tools.zip

        mkdir -p "$SDK_DIR/licenses"
        printf "\n24333f8a637b82e1e5c3169f824214741a33a50a\n89330d3222db157f9a15d58d3111266e7a869504\nd56f518747945141a054625d12335f5842614343\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$SDK_DIR/licenses/android-sdk-license"
        printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

    - name: Build with Buildozer
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ronyxaudio-apk
        path: bin/*.apk
