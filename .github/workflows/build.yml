name: Build Android APK (Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Configure Git Safe Directory
      run: |
        git config --global --add safe.directory '*'

    - name: Clean broken NDK and Buildozer caches
      run: |
        rm -rf .buildozer ~/.buildozer

    - name: Build with Buildozer
      env:
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee build.log

    - name: 🔍 Extrair Erro Real do Buildozer
      if: failure()
      run: |
        echo "=================== LINHAS COM ERRO DETECTADAS ==================="
        grep -i -C 3 -E "error:|command failed|exception|recipe.*failed" build.log | tail -n 50 || true
        echo "=================================================================="

    - name: Upload Debug Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-debug-log
        path: build.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ronyxaudio-apk
        path: bin/*.apk
