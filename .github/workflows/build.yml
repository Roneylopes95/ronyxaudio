name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure Git Safe Directory & Identity
      run: |
        git config --global --add safe.directory '*'
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget curl unzip libltdl-dev libffi-dev libssl-dev \
          build-essential zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo6 cmake libstdc++6 openjdk-17-jdk ant autoconf libtool pkg-config patch

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --user "Cython<3.0.0"
        pip install --user buildozer

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ronyxaudio-apk
        path: bin/*.apk
