name: Build Android APK (Native)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Buildozer & Dependencies
      run: |
        pip3 install --user --upgrade buildozer "cython<3.1.0" virtualenv
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build with Buildozer
      run: |
        buildozer -v android debug 2>&1 | tee build.log

    - name: 🔍 Extrair Erro Real do Buildozer
      if: failure()
      run: |
        echo "=================== LINHAS COM ERRO DETECTADAS ==================="
        grep -i -C 3 -E "error:|command failed|exception|recipe.*failed" build.log | tail -n 50 || true
        echo "=================================================================="

    - name: Upload Debug Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-debug-log
        path: build.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ronyxaudio-apk
        path: bin/*.apk
